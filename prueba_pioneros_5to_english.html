const SOPHIE_TEXT = "Hi! My name is Luca. I am ten years old and I live in a house near the sea. I have one sister. Her name is Sofia. We go to the same school. My favourite subject is Science because I love animals and nature. After school, I usually play football with my friends. On weekends, I like to read books or go to the park with my dog. His name is Biscuit and he is small and white. My favourite food is pasta. What about you?";

let sophiePlays = 0;
const MAX_PLAYS = 2;

function playSophie() {
  if (sophiePlays >= MAX_PLAYS) return;
  if (!window.speechSynthesis) {
    document.getElementById('listen-status').textContent = "Your browser doesn't support audio. Read the text carefully.";
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(SOPHIE_TEXT);
  utter.lang = 'en-GB';
  utter.rate = 0.88;
  utter.pitch = 1.1;
  // prefer a child/female voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => /female|girl|zira|samantha|karen|moira|tessa/i.test(v.name) && /en/i.test(v.lang))
                 || voices.find(v => /en/i.test(v.lang));
  if (preferred) utter.voice = preferred;
  sophiePlays++;
  const btn = document.getElementById('play-btn');
  const status = document.getElementById('listen-status');
  btn.disabled = true;
  btn.textContent = '🔊 Playing…';
  status.textContent = sophiePlays >= MAX_PLAYS ? 'You have used both plays.' : `Play ${sophiePlays} of ${MAX_PLAYS} used.`;
  utter.onend = () => {
    if (sophiePlays < MAX_PLAYS) {
      btn.disabled = false;
      btn.innerHTML = '▶ Play Again (' + (MAX_PLAYS - sophiePlays) + ' left)';
    } else {
      btn.textContent = 'No more plays';
    }
  };
  window.speechSynthesis.speak(utter);
}

// ─── STATE ───
const state = {
  name: "", grade: "", code: "",
  current: 0,
  answers: new Array(QUESTIONS.length).fill(null),
  secondsLeft: TOTAL_TIME,
  timerId: null,
  startTime: null,
  submitted: false
};

// ─── START ───
function startExam() {
  const name = document.getElementById('inp-name').value.trim();
  const err  = document.getElementById('cover-err');
  if (!name) { err.textContent = "Please enter the student's full name."; return; }
  state.name = name;
  state.grade = document.getElementById('inp-grade').value.trim();
  state.code = "—";
  state.startTime = new Date();
  showScreen('quiz');
  document.getElementById('timer-bar').style.display = 'block';
  document.getElementById('section-label').style.display = 'block';
  state.timerId = setInterval(tick, 1000);
  buildGrid();
  renderQuestion();
}

// ─── TIMER ───
function tick() {
  state.secondsLeft--;
  const bar = document.getElementById('timer-bar');
  if (state.secondsLeft <= 300) bar.classList.add('warning');
  if (state.secondsLeft <= 0) { clearInterval(state.timerId); submitExam(); return; }
  const m = Math.floor(state.secondsLeft / 60);
  const s = state.secondsLeft % 60;
  bar.textContent = `⏱ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── RENDER QUESTION ───
function renderQuestion() {
  const q = QUESTIONS[state.current];

  // Update section label
  if (q.part) {
    document.getElementById('section-label').textContent = q.part;
  }

  // Find active passage via backward lookup (for grouped sections)
  let activePassage = null, activeTitle = null;
  for (let i = state.current; i >= 0; i--) {
    if (QUESTIONS[i].passage !== null) {
      activePassage = QUESTIONS[i].passage;
      activeTitle   = QUESTIONS[i].passageTitle;
      break;
    }
  }

  let html = "";

  if (activePassage) {
    let passageHtml = activePassage;
    if (passageHtml.includes("[LISTENING_WIDGET]")) {
      passageHtml = `<div id="listening-widget">
        <p><strong>🎧 Listen to Luca's introduction (max. 2 plays)</strong></p>
        <button id="play-btn" onclick="playSophie()">▶ Play Audio</button>
        <div id="listen-status">Click to listen. You can play it twice.</div>
      </div>`;
    } else {
      passageHtml = passageHtml.replace(/\n/g, "<br>");
    }
    html += `<div class="passage-box">`;
    if (activeTitle) html += `<div class="passage-title">${activeTitle}</div>`;
    html += passageHtml + `</div>`;
  }

  html += `<div class="q-card">
    <div class="q-num">Question ${state.current + 1} of ${QUESTIONS.length}</div>
    <div class="q-text">${q.question.replace(/\n/g,"<br>")}</div>
    <div class="options" id="opts">`;
  q.options.forEach((opt, i) => {
    const sel = state.answers[state.current] === i ? " selected" : "";
    html += `<label class="${sel}"><input type="radio" name="opt" value="${i}" ${state.answers[state.current]===i?'checked':''} onchange="selectOpt(${i})">${opt}</label>`;
  });
  html += `</div></div>`;

  document.getElementById('quiz-area').innerHTML = html;
  document.getElementById('btn-prev').style.display   = state.current === 0 ? 'none' : '';
  const isLast = state.current === QUESTIONS.length - 1;
  document.getElementById('btn-next').style.display   = isLast ? 'none' : '';
  document.getElementById('btn-submit').style.display = isLast ? '' : 'none';
  updateGrid();
}

function selectOpt(i) {
  state.answers[state.current] = i;
  document.querySelectorAll('#opts label').forEach((l, idx) => {
    l.classList.toggle('selected', idx === i);
  });
  updateGrid();
}

function go(dir) {
  const next = state.current + dir;
  if (next < 0 || next >= QUESTIONS.length) return;
  state.current = next;
  renderQuestion();
}

function buildGrid() {
  const g = document.getElementById('grid-cells');
  g.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'jbtn';
    b.textContent = i + 1;
    b.onclick = () => { state.current = i; renderQuestion(); };
    g.appendChild(b);
  });
}

function updateGrid() {
  document.querySelectorAll('.jbtn').forEach((b, i) => {
    b.classList.toggle('answered', state.answers[i] !== null);
    b.classList.toggle('current',  i === state.current);
  });
}

function confirmSubmit() {
  const blank = state.answers.filter(a => a === null).length;
  const msg = blank > 0
    ? `You have ${blank} unanswered question(s). Are you sure you want to submit?`
    : 'Are you sure you want to submit the exam?';
  if (confirm(msg)) submitExam();
}

// ─── SUBMIT ───
function submitExam() {
  if (state.submitted) return;
  state.submitted = true;
  clearInterval(state.timerId);

  let correct = 0, wrong = 0, blank = 0;
  QUESTIONS.forEach((q, i) => {
    if (state.answers[i] === null) blank++;
    else if (state.answers[i] === q.answer) correct++;
    else wrong++;
  });

  const pct = Math.round((correct / QUESTIONS.length) * 100);
  const elapsed = Math.round((new Date() - state.startTime) / 1000);
  const mm = Math.floor(elapsed / 60), ss = elapsed % 60;
  const timeStr = `${mm}m ${ss}s`;

  // results hidden from student
  showScreen('results');

  const now     = new Date().toLocaleString('es-CL');
  const letters = ['A','B','C'];

  let det1 = '', det2 = '';
  QUESTIONS.forEach((q, i) => {
    const given   = state.answers[i] !== null ? letters[state.answers[i]] : '—';
    const correct_let = letters[q.answer];
    const ok      = state.answers[i] === q.answer ? '✓' : '✗';
    const line    = `P${i+1}: ${given} (correct: ${correct_let}) ${ok}\n`;
    if (i < 10) det1 += line; else det2 += line;
  });

  const base = {
    to_email: ADMIN_EMAIL,
    student_name: state.name,
    grade: state.grade,
    access_code: state.code,
    score: pct + '%',
    correct,
    wrong,
    blank,
    time_used: timeStr,
    submitted_at: now
  };

  emailjs.send("service_kk0m83i", "template_ebdohpd", {
    ...base,
    details: `ENGLISH 5th Grade — PART 1 (Q1–Q10)\n${det1}`
  }).then(() => {
    setTimeout(() => {
      emailjs.send("service_kk0m83i", "template_ebdohpd", {
        ...base,
        details: `ENGLISH 5th Grade — PART 2 (Q11–Q20)\n${det2}`
      }).then(() => {
        document.getElementById('status-msg').textContent = '✅ Results sent to ' + ADMIN_EMAIL;
      }).catch(e => {
        document.getElementById('status-msg').textContent = '⚠️ Error sending part 2: ' + (e.text||e);
      });
    }, 500);
  }).catch(e => {
    document.getElementById('status-msg').textContent = '⚠️ Error sending results: ' + (e.text||e);
  });
}
</script>
